<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة المشتريات - أناقة</title>
<style>
body{margin:0;font-family:Tajawal,sans-serif;background:#ffe4ec}
.header{background:#e93d8a;color:white;text-align:center;padding:25px}
.header a{color:white;text-decoration:none}
.products{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px}
.product{background:white;border-radius:15px;padding:15px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,0.08)}
.product img{width:100%;border-radius:10px}
.product h3{font-size:16px;margin:10px 0 5px;color:#333}
.product p{color:#e93d8a;font-weight:bold;margin:5px}
.btn-add{background:#e93d8a;color:white;border:none;padding:10px 20px;border-radius:20px;width:100%;font-size:14px}
.cart{position:fixed;bottom:0;left:0;right:0;background:white;padding:15px;border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -3px 15px rgba(0,0,0,0.1);text-align:center}
.btn-order{background:#25D366;color:white;padding:15px 30px;border-radius:30px;text-decoration:none;display:inline-block;font-weight:bold;font-size:18px;width:80%}
</style>
</head>
<body>
<div class="header">
<a href="index.html">⬅ الرجوع للرئيسية</a>
<h2>🛒 سلة المشتريات</h2>
</div>

<div class="products">
<div class="product">
