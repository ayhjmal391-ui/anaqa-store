<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر - أناقة</title>
<style>
body{margin:0;font-family:sans-serif;background:#ffe4ec}
.header{background:#e93d8a;color:white;text-align:center;padding:20px}
.products{padding:15px}
.product{background:white;border-radius:20px;padding:20px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#e93d8a;color:white;border:none;padding:12px 22px;border-radius:25px}
.cart-box{background:white;margin:15px;border-radius:20px;padding:20px;text-align:center}
.btn-order{background:#25D366;color:white;padding:15px 30px;border-radius:30px;text-decoration:none;display:block;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<a href="index.html" style="color:white">⬅ الرئيسية</a>
<h2>🛍️ متجر أناقة</h2>
</div>
<div class="products">
<div class="product"><div><h3>💄 روج ثابت</h3><p>2500 جنيه</p></div><button class="btn" onclick="add('روج')">+ إضافة</button></div>
<div class="product"><div><h3>✨ فاونديشن</h3><p>4500 جنيه</p></div><button class="btn" onclick="add('فاونديشن')">+ إضافة</button></div>
<div class="product"><div><h3>👁️ مسكرة</h3><p>3000 جنيه</p></div><button class="btn" onclick="add('مسكرة')">+ إضافة</button></div>
<div class="product"><div><h3>🌸 بلاشر</h3><p>2000 جنيه</p></div><button class="btn" onclick="add('بلاشر')">+ إضافة</button></div>
</div>
<div class="cart-box">
<h3>🛒 سلتك</h3>
<div id="list">لسه فاضية - دوسي + إضافة فوق</div>
<a id="wa" class="btn-order" href="#">اطلبي واتساب 💬</a>
</div>
<script>
let c=[];
function add(n){c.push(n);document.getElementById('list').innerHTML=c.join('<br>')+'<br><b>العدد:'+c.length+'</b>';let t='مرحبا أناقة عايزة: '+c.join(' , ');document.getElementById('wa').href='https://wa.me/249900000000?text='+encodeURIComponent(t);}
</script>
</body>
</html>
