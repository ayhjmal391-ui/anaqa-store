<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أناقة</title><style>body{margin:0;font-family:system-ui;background:#fff0f6}header{background:#fff;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0;box-shadow:0 2px 8px #0001}.logo{color:#ff2e7e;font-weight:900;font-size:20px}.tabs button{border:1px solid #ff2e7e;background:#fff;color:#ff2e7e;padding:6px 12px;border-radius:20px;margin:2px}.tabs button.active{background:#ff2e7e;color:#fff}.view{display:none;padding:12px}.view.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:14px;overflow:hidden}.card img{width:100%;height:160px;object-fit:cover}.p{padding:8px}.price{color:#ff2e7e;font-weight:800}.btn{display:block;background:#25D366;color:#fff;text-align:center;padding:8px;border-radius:10px;text-decoration:none;margin-top:6px;font-weight:700}.box{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px}.in{width:100%;padding:10px;border:1px solid #f9c;margin:6px 0;border-radius:8px}.bm{background:#ff2e7e;color:#fff;border:0;width:100%;padding:10px;border-radius:10px;font-weight:800}</style></head><body>
<header><div class="logo">أناقة ANAQA</div><div class="tabs"><button id="b1" class="active" onclick="s('shop','b1')">المتجر</button><button id="b2" onclick="s('admin','b2')">لوحتي</button></div></header>
<div id="shop" class="view active"><div class="grid" id="g"></div></div>
<div id="admin" class="view"><div id="lg" class="box"><h3>دخول</h3><p>السر anaqa123</p><input id="pw" class="in" type="password" placeholder="كلمة السر"><button class="bm" onclick="login()">دخول</button></div><div id="pn" style="display:none"><div class="box"><input id="n" class="in" placeholder="اسم المنتج"><input id="pr" class="in" type="number" placeholder="السعر"><input id="im" class="in" placeholder="رابط صورة"><button class="bm" onclick="add()">حفظ</button></div><div class="grid" id="ag"></div><button class="bm" style="background:#333;margin-top:10px" onclick="out()">خروج</button></div></div>
<script>
let WA="249905190175";let D=[{n:"فستان سهرة أنيق",p:12500,i:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"},{n:"عباية خليجية",p:18000,i:"https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=400"},{n:"طقم كاجوال",p:9500,i:"https://images.unsplash.com/photo-1550928431-ee0ec6db30d3?w=400"}];
let get=()=>JSON.parse(localStorage.getItem("a")||"null")||D;let save=a=>localStorage.setItem("a",JSON.stringify(a));
function r(){let a=get();g.innerHTML="";ag.innerHTML="";a.forEach((x,k)=>{let m=`عايزة ${x.n} سعره ${x.p}`;let u=`https://wa.me/${WA}?text=`+encodeURIComponent(m);let h=`<div class=card><img src=${x.i}><div class=p><b>${x.n}</b><br><span class=price>SDG ${x.p}</span><a class=btn href=${u} target=_blank>طلب واتساب</a></div></div>`;g.innerHTML+=h;ag.innerHTML+=h+`<button onclick="dl(${k})" style="width:100%;background:#fee;color:#c00;border:0;padding:4px;border-radius:6px">حذف</button>`})}
function s(v,b){document.querySelectorAll(".view").forEach(e=>e.classList.remove("active"));document.querySelectorAll(".tabs button").forEach(e=>e.classList.remove("active"));document.getElementById(v).classList.add("active");document.getElementById(b).classList.add("active")}
function login(){if(pw.value==="anaqa123"){lg.style.display="none";pn.style.display="block";localStorage.setItem("lg","1");r()}else alert("غلط")}function out(){localStorage.removeItem("lg");lg.style.display="block";pn.style.display="none"}function add(){if(!n.value||!pr.value)return alert("اكتبي");let a=get();a.unshift({n:n.value,p:pr.value,i:im.value||D[0].i});save(a);n.value="";pr.value="";im.value="";r();s("shop","b1")}function dl(k){let a=get();a.splice(k,1);save(a);r()}if(localStorage.getItem("lg")==="1"){lg.style.display="none";pn.style.display="block"}r();
</script></body></html>
